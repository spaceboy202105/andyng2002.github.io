name: Deploy approved site
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
env:
  SITE_URL: https://spaceboy202105.github.io
  SITE_BASE_PATH: /andyng2002.github.io/
jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install and verify PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex latexmk texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended fonts-texgyre poppler-utils
          xelatex --version
          latexmk -v
          test -n "$(kpsewhich ctexart.cls)"
          test -n "$(kpsewhich FandolSong-Regular.otf)"
          test -n "$(kpsewhich texgyretermes-regular.otf)"
          test -n "$(kpsewhich xurl.sty)"
          pdftotext -v
          pdftoppm -v
      - run: npm run verify:release
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified output
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
